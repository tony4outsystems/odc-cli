name: Release (Binaries + Skill)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - run: |
          mkdir -p odc-cli-x86_64-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/odc odc-cli-x86_64-linux-gnu/
          cp README.md LICENSE odc-cli-x86_64-linux-gnu/ 2>/dev/null || true
          tar czf odc-cli-x86_64-linux-gnu.tar.gz odc-cli-x86_64-linux-gnu/
          sha256sum odc-cli-x86_64-linux-gnu.tar.gz > odc-cli-x86_64-linux-gnu.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: odc-cli-*.tar.gz*

  build-macos-intel:
    name: Build macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin
      - run: |
          mkdir -p odc-cli-x86_64-darwin
          cp target/x86_64-apple-darwin/release/odc odc-cli-x86_64-darwin/
          cp README.md LICENSE odc-cli-x86_64-darwin/ 2>/dev/null || true
          tar czf odc-cli-x86_64-darwin.tar.gz odc-cli-x86_64-darwin/
          shasum -a 256 odc-cli-x86_64-darwin.tar.gz > odc-cli-x86_64-darwin.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-binaries
          path: odc-cli-*.tar.gz*

  build-macos-arm:
    name: Build macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: |
          mkdir -p odc-cli-aarch64-darwin
          cp target/aarch64-apple-darwin/release/odc odc-cli-aarch64-darwin/
          cp README.md LICENSE odc-cli-aarch64-darwin/ 2>/dev/null || true
          tar czf odc-cli-aarch64-darwin.tar.gz odc-cli-aarch64-darwin/
          shasum -a 256 odc-cli-aarch64-darwin.tar.gz > odc-cli-aarch64-darwin.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-binaries
          path: odc-cli-*.tar.gz*

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: powershell
        run: |
          mkdir odc-cli-x86_64-windows
          Copy-Item target\x86_64-pc-windows-msvc\release\odc.exe odc-cli-x86_64-windows\
          if (Test-Path README.md) { Copy-Item README.md odc-cli-x86_64-windows\ }
          if (Test-Path LICENSE) { Copy-Item LICENSE odc-cli-x86_64-windows\ }
          Compress-Archive -Path odc-cli-x86_64-windows -DestinationPath odc-cli-x86_64-windows.zip
          $hash = (Get-FileHash "odc-cli-x86_64-windows.zip" -Algorithm SHA256).Hash
          "$hash  odc-cli-x86_64-windows.zip" | Out-File "odc-cli-x86_64-windows.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: odc-cli-*.zip*

  package-skill:
    name: Package Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python scripts/package_skill.py skills/odc-cli-helper odc-cli-helper.skill
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: odc-cli-helper.skill

  publish:
    name: Publish Release
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows, package-skill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts and list
        run: |
          mkdir final-release
          find release-artifacts -type f -exec cp {} final-release/ \;
          ls -lh final-release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: final-release/*
          body: |
            # Release ${{ github.ref_name }}

            This release includes:
            - **CLI Binaries**: macOS (Intel/ARM), Linux (amd64), Windows (amd64)
            - **Agent Skill**: ODC CLI Helper skill for Claude Code

            ## Installation

            ### Binary Installation
            Download the appropriate archive for your platform from the assets below:
            - `odc-cli-x86_64-linux-gnu.tar.gz` — Linux x86_64
            - `odc-cli-x86_64-darwin.tar.gz` — macOS Intel
            - `odc-cli-aarch64-darwin.tar.gz` — macOS ARM
            - `odc-cli-x86_64-windows.zip` — Windows

            Extract and add the `odc` (or `odc.exe` on Windows) binary to your PATH.

            Verify installation: `odc --version`

            ### Skill Installation
            1. Download `odc-cli-helper.skill` from the assets
            2. Open it with Claude Code
            3. Click "Install" or copy to `~/.claude/skills/`

            ## What's included
            - Installation guidance and setup
            - Credential configuration
            - Common commands reference
            - Deployment and app management
            - Troubleshooting guide

            ## Checksums
            SHA256 checksums are included for each archive to verify integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
