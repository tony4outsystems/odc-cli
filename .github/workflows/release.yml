name: Release (Binaries + Skill)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - name: Build dist artifacts
        run: |
          cargo dist build --output-format=json > dist-manifest.json
          ls -la dist/ || echo "No dist/ directory"
          cat dist-manifest.json | head -20
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/**/SHA256SUMS
            dist/**/*.msi
            dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-skill:
    name: Release Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Package skill
        run: |
          python scripts/package_skill.py skills/odc-cli-helper odc-cli-helper.skill
          ls -lh odc-cli-helper.skill
      - name: Get skill metadata
        id: metadata
        run: |
          VERSION=$(git describe --tags --always --dirty)
          SKILL_NAME=$(grep "^name:" skills/odc-cli-helper/SKILL.md | cut -d: -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "skill_name=$SKILL_NAME" >> $GITHUB_OUTPUT
          echo "Skill: $SKILL_NAME (version: $VERSION)"
      - name: Upload skill to release
        uses: softprops/action-gh-release@v1
        with:
          files: odc-cli-helper.skill
          body: |
            # Release ${{ github.ref_name }}

            This release includes:
            - **CLI Binaries**: macOS (Intel/ARM), Linux (amd64/arm64), Windows (amd64)
            - **Agent Skill**: ODC CLI Helper skill for Claude Code

            ## Installation

            ### Binary Installation
            See the assets below for platform-specific binaries.

            ### Skill Installation
            1. Download `odc-cli-helper.skill` from this release
            2. Open it with Claude Code
            3. Click "Install" or copy to `~/.claude/skills/`

            ## What's included
            - Installation guidance (Homebrew on macOS, build from source on Windows/Linux)
            - Credential setup and configuration
            - Common commands reference
            - Deployment and app management
            - Troubleshooting guide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
