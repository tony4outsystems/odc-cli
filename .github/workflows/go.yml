name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/odc ./cmd/odc
