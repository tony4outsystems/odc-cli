<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace">
  <style>
    .win { fill: #1e1e2e; }
    .bar { fill: #313244; }
    .dot-r { fill: #f38ba8; }
    .dot-y { fill: #f9e2af; }
    .dot-g { fill: #a6e3a1; }
    .title { fill: #a6adc8; font-size: 13px; }
    .prompt { fill: #a6e3a1; font-size: 15px; }
    .cmd { fill: #cdd6f4; font-size: 15px; }
    .out { fill: #89b4fa; font-size: 14px; }
    .out-dim { fill: #6c7086; font-size: 14px; }
    .ok { fill: #a6e3a1; font-size: 14px; }
    .cursor { fill: #cdd6f4; }

    text { white-space: pre; }

    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }

    .cursor {
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .loop {
      animation-name: reveal;
      animation-duration: 0.01s;
      animation-delay: var(--in);
      animation-fill-mode: forwards;
      animation-timing-function: steps(1);
    }
  </style>

  <rect width="760" height="400" rx="10" class="win"/>
  <rect width="760" height="34" rx="10" class="bar"/>
  <rect y="24" width="760" height="10" class="bar"/>
  <circle cx="24" cy="17" r="6" class="dot-r"/>
  <circle cx="44" cy="17" r="6" class="dot-y"/>
  <circle cx="64" cy="17" r="6" class="dot-g"/>
  <text x="380" y="21" text-anchor="middle" class="title">odc — zsh</text>

  <g transform="translate(20, 65)" font-size="15">
    <!-- discover -->
    <text class="loop" style="--in:0.3s"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">odc discover</tspan><tspan class="cursor" dx="4">▊</tspan></text>

    <text y="26" class="loop out-dim" style="--in:1.6s">Discovering tenant OIDC metadata...</text>
    <text y="48" class="loop ok" style="--in:3.2s">✓ issuer: https://acme.outsystems.dev</text>

    <!-- list-apps -->
    <text y="82" class="loop" style="--in:4.6s"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">odc list-apps --search eGov</tspan><tspan class="cursor" dx="4">▊</tspan></text>

    <text y="108" class="loop out" style="--in:5.5s">name              key        type</text>
    <text y="128" class="loop out-dim" style="--in:5.5s">eGovPortal        3f9a-21e   WebApplication</text>
    <text y="148" class="loop out-dim" style="--in:5.5s">eGovCore          8b1c-77d   LowCodeLibrary</text>

    <!-- deploy -->
    <text y="182" class="loop" style="--in:7.5s"><tspan class="prompt">$</tspan><tspan class="cmd" dx="8">odc deploy --asset eGovPortal --env Production</tspan><tspan class="cursor" dx="4">▊</tspan></text>

    <text y="208" class="loop out-dim" style="--in:8.8s">Building revision 14 (Release)...</text>
    <text y="228" class="loop out-dim" style="--in:9.1s">Deploying to Production...</text>
    <text y="248" class="loop ok" style="--in:9.4s">✓ eGovPortal rev 14 deployed to Production</text>
  </g>
</svg>
