[tasks.build]
description = 'Build release'
sources = ['Cargo.toml', 'src/**/*.rs']
outputs = ['target/release/odc']
run = "cargo build --release"

[tasks.demo]
description = "Regenerate demo.gif using VHS"
depends = ["build"]
sources = ["scripts/demo/demo.tape"]
outputs = ["demo.gif"]
run = 'PATH="$PWD/target/release:$PATH" vhs scripts/demo/demo.tape --output demo.gif'

[tasks.mermaid-graph]
description = "Generate mermaid-graph.png (requires tenant credentials)"
depends = ["build"]
outputs = ["mermaid-graph.png"]
run = [
  "target/release/odc producer-graph eGovPortal --output eGovPortal-producers-graph.mmd",
  "npx @mermaid-js/mermaid-cli -i eGovPortal-producers-graph.mmd -o mermaid-graph.png",
]
