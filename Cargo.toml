[package]
name = "odc"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["string", "derive"] }
clap_complete = "4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
percent-encoding = "2"
httpdate = "1"
rpassword = "7"
sha1_smol = "1"
regex = "1"
anyhow = "1"
tempfile = "3"
tabwriter = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
dirs = "5"
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
termimad = "0.30"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
