[package]
name = "odc"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/tony4outsystems/odc-cli"
description = "OutSystems ODC CLI - Deploy and manage apps in OutSystems Developer Cloud"
homepage = "https://github.com/tony4outsystems/odc-cli"

[dependencies]
clap = { version = "4", features = ["string", "derive"] }
clap_complete = "4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
percent-encoding = "2"
httpdate = "1"
rpassword = "7"
sha1_smol = "1"
regex = "1"
anyhow = "1"
tempfile = "3"
tabwriter = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
dirs = "5"
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
termimad = "0.30"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "fat"

[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml syntax)
cargo-dist-version = "0.33.0"
# CI backends, see Cargo.toml documentation for valid options
ci = ["github"]
# The installers to generate for each app
installers = ["homebrew", "shell"]
# A GitHub repo to push HomebrewFormulas to
tap = "tony4outsystems/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# The archives to generate
archives = ["tar-xz", "zip"]
