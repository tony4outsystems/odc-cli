[package]
name = "odc"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["string"] }
clap_complete = "4"
ureq = { version = "3", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
percent-encoding = "2"
httpdate = "1"
rpassword = "7"
sha1_smol = "1"
regex = "1"
anyhow = "1"
tempfile = "3"
tabwriter = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
